name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Bogdanp/setup-racket@v1.2
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable

      - name: Install package
        run: raco pkg install --auto --batch --link ${{ github.workspace }}

      - name: Run tests
        run: raco test tests

      - name: Build docs and check package deps
        run: raco setup --check-pkg-deps -l websocket
